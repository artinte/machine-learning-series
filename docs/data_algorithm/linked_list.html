            <p style="color: #a0a0a0;">创建日期: 2024-02-19</p>
            <p><strong>链表 (Listed List)</strong> 是一种线性数据结构，其中的每个元素都是一个节点对象，各个节点通过引用相连接。引用记录了下一个节点的内存地址，通过它可以从当前节点访问到下一个节点。</p>
            <p>链表的设计使得各个节点可以分散存储在内存各处，它们的内存地址无须连续。</p>
            <p>链表的组成单位是对象，每个节点都包含两项数据：节点的值和指向下一个节点的引用。</p>
